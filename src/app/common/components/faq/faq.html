<section aria-labelledby="faq-title" class="sheet bg-paper">
  <div class="mx-auto max-w-[1180px] px-6 py-14 lg:px-10 lg:py-20">
    <div appReveal class="grid gap-9 lg:grid-cols-[0.8fr_1.2fr] lg:gap-16">
      <div>
        <p class="mb-5 font-mono text-[10.5px] font-medium tracking-[0.18em] text-brand uppercase">
          Preguntas
        </p>
        <h2
          id="faq-title"
          class="text-[26px] leading-[1.08] font-extrabold tracking-[-0.035em] text-ink sm:text-[34px]"
        >
          {{ heading() }}
        </h2>
      </div>

      <div class="flex flex-col gap-2.5">
        @for (item of items(); track item.question) {
          <details class="faq-item group rounded-2xl bg-white px-5 py-4">
            <summary class="flex cursor-pointer list-none items-start gap-4 marker:content-none">
              <span class="flex-1 text-[16px] leading-snug font-bold text-ink">
                {{ item.question }}
              </span>
              <span
                class="mt-0.5 flex h-6 w-6 flex-none items-center justify-center rounded-full bg-brand text-white transition-transform duration-400 ease-[cubic-bezier(0.4,0,0.2,1)] group-open:rotate-45"
                aria-hidden="true"
              >
                <svg viewBox="0 0 12 12" fill="none" class="h-3 w-3">
                  <path
                    d="M6 1.5v9M1.5 6h9"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
            </summary>
            <p class="mt-3.5 pr-10 text-[15px] leading-[1.7] text-muted">{{ item.answer }}</p>
          </details>
        }
      </div>
    </div>
  </div>
</section>
