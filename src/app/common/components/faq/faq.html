<section aria-labelledby="faq-title" class="bg-white py-14 lg:py-[68px]">
  <div class="mx-auto max-w-[820px] px-6 lg:px-8">
    <h2
      id="faq-title"
      class="mb-8 text-[26px] font-extrabold tracking-tight text-balance sm:text-[30px]"
    >
      {{ heading() }}
    </h2>

    <div class="flex flex-col gap-3">
      @for (item of items(); track item.question) {
        <details class="group rounded-xl border border-line bg-canvas px-5 py-4">
          <summary
            class="cursor-pointer list-none text-[15.5px] font-bold text-ink marker:content-none"
          >
            <span class="flex items-start justify-between gap-4">
              {{ item.question }}
              <span
                class="mt-0.5 flex-none text-brand transition-transform group-open:rotate-45"
                aria-hidden="true"
                >+</span
              >
            </span>
          </summary>
          <p class="mt-3 text-[15px] leading-[1.7] text-muted">{{ item.answer }}</p>
        </details>
      }
    </div>
  </div>
</section>
