<section [class]="tint() ? 'bg-tint' : 'bg-white'" class="py-14 lg:py-[68px]">
  <div class="mx-auto max-w-[820px] px-6 lg:px-8">
    <h2 class="mb-5 text-[26px] font-extrabold tracking-tight text-balance sm:text-[30px]">
      {{ heading() }}
    </h2>

    @for (paragraph of paragraphs(); track paragraph) {
      <p class="mb-4 text-[16px] leading-[1.7] text-muted">{{ paragraph }}</p>
    }

    @if (bullets().length) {
      <ul class="mt-6 flex flex-col gap-3">
        @for (bullet of bullets(); track bullet) {
          <li class="flex items-start gap-2.5">
            <span
              class="mt-0.5 flex h-5 w-5 flex-none items-center justify-center rounded-full bg-tint text-xs font-extrabold text-brand"
              aria-hidden="true"
              >✓</span
            >
            <span class="text-[15px] leading-relaxed text-ink">{{ bullet }}</span>
          </li>
        }
      </ul>
    }

    <ng-content />
  </div>
</section>
