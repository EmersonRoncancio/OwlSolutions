<section [class]="tint() ? 'bg-tint' : 'bg-white'" class="py-14 lg:py-[68px]">
  <div class="mx-auto max-w-[1180px] px-6 lg:px-8">
    <div class="mx-auto mb-10 max-w-[640px] text-center">
      <h2 class="mb-3.5 text-[26px] font-extrabold tracking-tight text-balance sm:text-[30px]">
        {{ heading() }}
      </h2>
      @if (intro()) {
        <p class="text-[16px] leading-relaxed text-muted">{{ intro() }}</p>
      }
    </div>

    <ul class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
      @for (feature of features(); track feature.title; let i = $index) {
        <li class="rounded-xl border border-line bg-canvas p-6">
          @if (numbered()) {
            <span
              class="mb-3 inline-flex h-8 w-8 items-center justify-center rounded-full bg-brand text-sm font-extrabold text-white"
              aria-hidden="true"
              >{{ i + 1 }}</span
            >
          }
          <h3 class="mb-1.5 text-[16px] font-bold text-ink">{{ feature.title }}</h3>
          <p class="text-[14px] leading-relaxed text-muted">{{ feature.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
