<section [class]="tint() ? 'bg-tint' : 'bg-paper'" class="sheet">
  <div class="mx-auto max-w-[1180px] px-6 py-14 lg:px-10 lg:py-20">
    <h2
      appReveal
      class="max-w-[720px] text-[28px] leading-[1.08] font-extrabold tracking-[-0.035em] text-ink sm:text-[38px]"
    >
      {{ heading() }}
    </h2>
    @if (intro()) {
      <p class="mt-5 max-w-[560px] text-[16.5px] leading-relaxed text-muted">{{ intro() }}</p>
    }

    <ul class="mt-10 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
      @for (feature of features(); track feature.title; let i = $index) {
        <li [appReveal]="i * 70" class="tile bg-white p-7">
          <p
            [class]="numbered() ? 'text-[13px] text-brand' : 'text-[11px] text-muted'"
            class="mb-5 font-mono font-extrabold tracking-[0.1em]"
            aria-hidden="true"
          >
            {{ i + 1 < 10 ? '0' + (i + 1) : i + 1 }}
          </p>
          <h3 class="mb-2.5 text-[16.5px] leading-snug font-bold text-ink">{{ feature.title }}</h3>
          <p class="text-[14px] leading-relaxed text-muted">{{ feature.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
