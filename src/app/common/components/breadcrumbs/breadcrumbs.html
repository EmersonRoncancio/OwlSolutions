<nav aria-label="Ruta de navegación" class="mx-auto max-w-[1180px] px-6 pt-5 lg:px-8">
  <ol class="flex flex-wrap items-center gap-1.5 text-[13px] text-muted">
    @for (item of items(); track item.path; let last = $last) {
      <li class="flex items-center gap-1.5">
        @if (last) {
          <span aria-current="page" class="font-semibold text-ink">{{ item.label }}</span>
        } @else {
          <a [routerLink]="item.path" class="transition-colors hover:text-brand">{{ item.label }}</a>
          <span aria-hidden="true" class="text-line">/</span>
        }
      </li>
    }
  </ol>
</nav>
