<section class="sheet bg-[linear-gradient(135deg,#23063f_0%,#3c0b6b_50%,#7b1fb8_100%)]">
  <div class="dots absolute inset-0 opacity-70" aria-hidden="true"></div>
  <div
    class="absolute -top-32 -right-24 h-[400px] w-[400px] rounded-full bg-[radial-gradient(circle,rgba(163,64,223,0.45)_0%,transparent_68%)]"
    aria-hidden="true"
  ></div>

  <div class="relative mx-auto max-w-[1180px] px-6 py-14 lg:px-10 lg:py-20">
    <p class="mb-6 font-mono text-[10.5px] font-medium tracking-[0.18em] text-soft uppercase">
      {{ eyebrow() }}
    </p>

    <h1
      class="max-w-[860px] text-[32px] leading-[1.06] font-extrabold tracking-[-0.035em] text-white sm:text-[42px] lg:text-[50px]"
    >
      {{ heading() }}
    </h1>

    <p class="mt-6 max-w-[600px] text-[16.5px] leading-relaxed text-pale">{{ lead() }}</p>

    @if (highlights().length) {
      <ul class="mt-8 flex flex-wrap gap-2.5">
        @for (highlight of highlights(); track highlight) {
          <li class="rounded-full bg-white/12 px-3.5 py-1.5 text-[13px] font-semibold text-white">
            {{ highlight }}
          </li>
        }
      </ul>
    }

    <div class="mt-9 flex flex-wrap items-center gap-3">
      <a
        [href]="ctaHref()"
        target="_blank"
        rel="noopener noreferrer"
        class="group inline-flex items-center gap-2 rounded-full bg-white px-7 py-3.5 text-[15px] font-bold text-ink transition-colors hover:bg-pale"
      >
        {{ ctaLabel() }}
        <span class="arrow-shift" aria-hidden="true">→</span>
      </a>

      @if (secondaryLabel() && secondaryPath()) {
        <a
          [routerLink]="secondaryPath()"
          class="group inline-flex items-center gap-2 rounded-full bg-white/10 px-6 py-3.5 text-[15px] font-semibold text-white transition-colors hover:bg-white/20"
        >
          {{ secondaryLabel() }}
          <span class="arrow-shift text-soft" aria-hidden="true">→</span>
        </a>
      }
    </div>
  </div>
</section>
