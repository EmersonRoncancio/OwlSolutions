<section aria-labelledby="relacionados-title" class="sheet bg-tint">
  <div class="mx-auto max-w-[1180px] px-6 py-14 lg:px-10 lg:py-16">
    <h2
      appReveal
      id="relacionados-title"
      class="max-w-[700px] text-[24px] leading-[1.1] font-extrabold tracking-[-0.03em] text-ink sm:text-[32px]"
    >
      {{ heading() }}
    </h2>

    <ul class="mt-9 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
      @for (link of links(); track link.path; let i = $index) {
        <li [appReveal]="i * 70" class="tile group bg-white p-7">
          <h3 class="mb-2.5 text-[16.5px] leading-snug font-bold">
            <a [routerLink]="link.path" class="inline-flex items-center gap-2 text-brand">
              {{ link.label }}
              <span class="arrow-shift" aria-hidden="true">→</span>
            </a>
          </h3>
          <p class="text-[14px] leading-relaxed text-muted">{{ link.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
