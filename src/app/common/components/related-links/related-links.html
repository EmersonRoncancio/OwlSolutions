<section aria-labelledby="relacionados-title" class="bg-tint py-14 lg:py-[68px]">
  <div class="mx-auto max-w-[1180px] px-6 lg:px-8">
    <h2
      id="relacionados-title"
      class="mb-8 text-[24px] font-extrabold tracking-tight text-balance sm:text-[28px]"
    >
      {{ heading() }}
    </h2>

    <ul class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
      @for (link of links(); track link.path) {
        <li class="rounded-xl border border-line bg-white p-6">
          <h3 class="mb-1.5 text-[16px] font-bold">
            <a [routerLink]="link.path" class="text-brand hover:underline">{{ link.label }}</a>
          </h3>
          <p class="text-[14px] leading-relaxed text-muted">{{ link.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
