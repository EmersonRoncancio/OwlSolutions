<section class="sheet bg-[linear-gradient(120deg,#6a17b5_0%,#902bcc_55%,#a340df_100%)]">
  <div class="dots absolute inset-0 opacity-60" aria-hidden="true"></div>

  <div class="relative mx-auto max-w-[1180px] px-6 py-14 lg:px-10 lg:py-20">
    <div>
      <div appReveal>
        <h2
          class="max-w-[620px] text-[28px] leading-[1.06] font-extrabold tracking-[-0.035em] text-white sm:text-[38px]"
        >
          {{ heading() }}
        </h2>
        <p class="mt-5 max-w-[460px] text-[16.5px] leading-relaxed text-pale">{{ text() }}</p>
      </div>

      <div appReveal="120" class="mt-9 flex flex-wrap items-center gap-3">
        <a
          [href]="whatsappUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="group inline-flex items-center gap-2 rounded-full bg-white px-7 py-3.5 text-[15px] font-bold text-ink transition-colors hover:bg-pale"
        >
          {{ ctaLabel() }}
          <span class="arrow-shift" aria-hidden="true">→</span>
        </a>
        <a
          [href]="'mailto:' + contactEmail"
          class="inline-flex items-center rounded-full bg-white/15 px-6 py-3.5 font-mono text-[14px] font-semibold text-white transition-colors hover:bg-white/25"
        >
          {{ contactEmail }}
        </a>
      </div>
    </div>
  </div>
</section>
