<article [class]="sectionClass()" class="py-16 lg:py-[72px]">
  <div
    class="mx-auto grid max-w-[1180px] grid-cols-1 items-center gap-12 px-6 lg:grid-cols-2 lg:gap-16 lg:px-8"
  >
    <div>
      <p
        [class]="eyebrowClass()"
        class="mb-3.5 text-[12.5px] font-bold tracking-[0.08em] uppercase"
      >
        {{ product().eyebrow }}
      </p>

      <h3 [class]="headingClass()" class="mb-4 text-[26px] font-extrabold tracking-tight sm:text-[30px]">
        {{ product().name }}
      </h3>

      <p [class]="bodyClass()" class="mb-6 text-base leading-[1.65]">
        {{ product().description }}
      </p>

      <ul class="mb-6 flex flex-col gap-3">
        @for (feature of product().features; track feature) {
          <li class="flex items-start gap-2.5">
            <span
              [class]="checkClass()"
              class="mt-0.5 flex h-5 w-5 flex-none items-center justify-center rounded-full text-xs font-extrabold"
              aria-hidden="true"
              >✓</span
            >
            <span [class]="headingClass()" class="text-[15px]">{{ feature }}</span>
          </li>
        }
      </ul>

      <p [class]="softClass()" class="mb-6 rounded-[10px] px-4 py-3.5 text-sm">
        <strong [class]="headingClass()" class="font-bold">Caso de uso: </strong>
        <span [class]="bodyClass()">{{ product().useCase }}</span>
      </p>

      <a
        [href]="product().ctaHref"
        [class]="eyebrowClass()"
        class="inline-block text-[15px] font-bold hover:underline"
      >
        {{ product().cta }} →
      </a>
    </div>

    <div [class]="imageOrderClass()" class="relative flex min-h-[320px] items-center justify-center lg:min-h-[440px]">
      <span
        aria-hidden="true"
        [class]="haloClass()"
        class="absolute top-1/2 left-1/2 h-[260px] w-[260px] -translate-x-1/2 -translate-y-1/2 rounded-full blur-2xl lg:h-[340px] lg:w-[340px]"
      ></span>
      <span
        aria-hidden="true"
        [class]="ringClass()"
        class="absolute top-1/2 left-1/2 hidden h-[400px] w-[400px] -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-dashed lg:block"
      ></span>
      <span
        aria-hidden="true"
        [class]="dotClass()"
        class="absolute top-[10%] left-[6%] hidden h-3 w-3 rounded-full lg:block"
      ></span>
      <span
        aria-hidden="true"
        [class]="ringDotClass()"
        class="absolute right-[8%] bottom-[14%] hidden h-[18px] w-[18px] rounded-full border-2 lg:block"
      ></span>

      <picture>
        <source [srcset]="product().image.webp" type="image/webp" />
        <img
          [src]="product().image.png"
          [alt]="product().image.alt"
          [width]="product().image.width"
          [height]="product().image.height"
          loading="lazy"
          decoding="async"
          class="relative block h-auto w-full max-w-[280px] drop-shadow-[0_24px_40px_rgba(21,14,36,0.3)] lg:max-w-[340px]"
        />
      </picture>
    </div>
  </div>
</article>
