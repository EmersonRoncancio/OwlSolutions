<section
  class="relative flex flex-col overflow-hidden bg-[linear-gradient(160deg,#2A1155_0%,#4C1D95_42%,#902BCC_100%)]"
>
  <p
    class="bg-black/20 py-2.5 text-center text-[13px] font-semibold tracking-[0.03em] text-lavender"
  >
    Implementación en menos de 2 semanas
  </p>

  <!-- Decoración -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
    <span
      class="absolute top-[120px] right-[60px] hidden h-[110px] w-[110px] rounded-full border-2 border-dashed border-white/20 lg:block"
    ></span>
    <span class="absolute bottom-[180px] left-16 hidden h-3.5 w-3.5 rounded-full bg-accent/70 lg:block"></span>
    <span class="absolute bottom-[260px] left-[120px] hidden h-2 w-2 rounded-full bg-white/50 lg:block"></span>
    <span
      class="absolute -bottom-40 -left-32 h-[420px] w-[420px] rounded-full bg-[radial-gradient(circle,rgba(233,79,209,0.28)_0%,transparent_70%)] blur-[10px]"
    ></span>
    <span
      class="absolute bottom-10 left-[200px] hidden h-[150px] w-[150px] rounded-full border-2 border-dashed border-white/15 lg:block"
    ></span>
    <span class="absolute top-[70%] left-[38%] hidden h-1.5 w-1.5 rounded-full bg-white/35 lg:block"></span>
    <span class="absolute top-[64%] left-[44%] hidden h-2.5 w-2.5 rounded-full bg-white/20 lg:block"></span>
    <span
      class="absolute bottom-[120px] left-[340px] hidden text-[26px] font-extrabold tracking-[0.1em] text-white/15 lg:block"
      >+</span
    >
    <span
      class="absolute top-[200px] -right-8 hidden text-[12px] font-bold tracking-[0.25em] text-white/30 [writing-mode:vertical-rl] xl:block"
      >SOFTWARE HECHO EN COLOMBIA</span
    >
  </div>

  <div
    class="relative mx-auto grid w-full max-w-[1180px] grid-cols-1 items-center gap-10 px-6 pt-16 pb-24 lg:grid-cols-[1.05fr_0.95fr] lg:px-8 lg:pt-[88px] lg:pb-[150px]"
  >
    <div>
      <h1 class="mb-7 text-white">
        <span
          class="block text-[44px] leading-none font-extrabold tracking-tight sm:text-[56px]"
        >
          IMPULSA
        </span>
        <span
          class="my-3.5 inline-block -rotate-[1.5deg] bg-accent px-4.5 py-1.5 text-[32px] leading-[1.15] font-extrabold tracking-tight text-brand-night shadow-[0_10px_24px_-10px_rgba(0,0,0,0.4)] sm:text-[40px]"
        >
          TU NEGOCIO
        </span>
        <span
          class="block w-fit rounded-full border border-white/30 bg-white/15 px-4 py-2 text-base font-bold"
        >
          CON SOFTWARE QUE SÍ USAS
        </span>
      </h1>

      <p class="mb-7 max-w-[440px] text-[16.5px] leading-relaxed text-lavender">
        Facturación electrónica DIAN, agentes de IA para soporte y ventas, y desarrollo a la medida
        — todo en un solo lugar.
      </p>

      <a
        href="#productos"
        class="inline-block rounded-full bg-accent px-7 py-4 text-base font-extrabold text-brand-night shadow-[0_14px_30px_-10px_rgba(233,79,209,0.6)] transition-transform hover:-translate-y-0.5"
      >
        Da clic aquí y agenda tu demo →
      </a>
    </div>

    <div class="relative flex justify-center">
      <span
        aria-hidden="true"
        class="absolute top-1/2 left-1/2 h-[320px] w-[320px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-[radial-gradient(circle,rgba(255,255,255,0.22)_0%,rgba(233,79,209,0.16)_55%,transparent_75%)] blur-[6px] lg:h-[460px] lg:w-[460px]"
      ></span>
      <picture>
        <source
          type="image/webp"
          srcset="/images/hero-composed-720.webp 720w, /images/hero-composed.webp 1120w"
          sizes="(min-width: 1024px) 560px, 100vw"
        />
        <img
          src="/images/hero-composed.png"
          alt="Persona usando laptop con Siwina: facturación electrónica DIAN, agentes de IA y ventas centralizadas"
          width="1120"
          height="840"
          fetchpriority="high"
          decoding="async"
          class="relative h-auto w-full max-w-[560px] drop-shadow-[0_20px_40px_rgba(0,0,0,0.35)]"
        />
      </picture>
    </div>
  </div>
</section>
